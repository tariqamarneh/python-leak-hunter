[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[project]
name = "python-leak-hunter"
version = "0.1.1"
description = "Find memory leaks in long-running Python services: what accumulates, what keeps it alive, and a test that keeps it fixed. Ships with an agent skill for Claude Code and Codex."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Tariq Amarneh", email = "tariqs.naser@gmail.com" }]
keywords = ["memory leak", "profiling", "debugging", "pytest", "gc", "contextvars", "langgraph", "agent skill"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Framework :: Pytest",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Software Development :: Debuggers",
    "Topic :: Software Development :: Testing",
    "Typing :: Typed",
]
dependencies = []

[project.optional-dependencies]
psutil = ["psutil>=5.9"]

[project.urls]
Homepage = "https://github.com/tariqamarneh/python-leak-hunter"
"The leak behind it" = "https://www.tariqamarneh.com/writing/grpc-contextvars-memory-leak"

[project.scripts]
leak-hunter = "leak_hunter.cli:main"

[project.entry-points.pytest11]
leak_hunter = "leak_hunter.pytest_plugin"

[dependency-groups]
dev = ["pytest>=8", "mypy>=1.11", "ruff>=0.6"]

[tool.hatch.build.targets.wheel]
packages = ["src/leak_hunter"]

[tool.ruff]
line-length = 110
target-version = "py310"
extend-exclude = ["*.md"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.mypy]
strict = true
python_version = "3.10"
files = ["src", "tests", "examples"]
mypy_path = "examples/contextvars_leak"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
pythonpath = ["examples/contextvars_leak"]
